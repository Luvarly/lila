[project]
name = "lila"
version = "0.1.0"
description = "A personal voice assistant: talk to an agent that works in a folder on your machine. Powered by Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "OnlyF0uR", email = "29165327+OnlyF0uR@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.165,<0.3",
    "fish-audio-sdk>=1.3,<2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
lila = "lila.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ASYNC"]
