name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: No credential handling in the package source (R9)
        shell: bash
        run: |
          if grep -rniE '\.credentials\.json|api\.anthropic\.com|anthropic-beta|keychain' src/lila; then
            echo "Forbidden string found in src/lila"
            exit 1
          fi
